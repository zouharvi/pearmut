[project]
name = "pearmut"
version = "1.1.6"
description = "A tool for evaluation of model outputs, primarily MT."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Vilém Zouhar", email = "vilem.zouhar@gmail.com" }]
keywords = [
    "evaluation",
    "machine translation",
    "human evaluation",
    "annotation",
]
dependencies = [
    "fastapi >= 0.110",
    "uvicorn >= 0.29",
    "wonderwords >= 3.0",
    "typst >= 0.14",
    "scipy >= 1.16",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.4",
    "ruff >= 0.16",
]

[project.scripts]
pearmut = "pearmut.cli:main"

[project.urls]
Repository = "https://github.com/zouharvi/pearmut"
Issues = "https://github.com/zouharvi/pearmut/issues"

[tool.setuptools]
package-dir = { pearmut = "server", "pearmut.web" = "web" }
packages = ["pearmut", "pearmut.web"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"pearmut" = ["static/**"]
"pearmut.web" = ["*", "**/*"]

[tool.setuptools.exclude-package-data]
"pearmut.web" = ["node_modules/**", "node_modules", "package-lock.json"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]